<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ال سوخاری | سفارش‌یار v5.24</title>
<style>
:root{--yellow:#ffc928;--dark:#101318;--card:#fff;--muted:#68707d;--green:#16a35a;--red:#e5484d;--bg:#f4f5f7;--line:#e7e9ed;--blue:#e9f2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#17191d}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}header{background:var(--dark);color:#fff;padding:18px;position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:900}.brand small{display:block;color:#ffd43b;font-size:12px;margin-top:4px}.topnote{font-size:11px;color:#c8cbd1;margin-top:8px}main{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{padding:22px 14px;border-radius:18px;min-height:120px;text-align:right;font-weight:800;box-shadow:0 3px 12px #0000000d}.tile b{display:block;font-size:17px;margin-bottom:8px}.tile span{font-size:12px;color:#5e6570}.yellow{background:#ffd43b}.blue{background:#dceeff}.green{background:#c9f6dc}.purple{background:#eadcff}.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #0000000b}h2{font-size:20px;margin:6px 0 15px}h3{font-size:15px;margin:4px 0 10px}label{font-size:12px;color:var(--muted);display:block;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid #d9dde3;border-radius:12px;padding:12px;background:#fff;outline:none}input:focus,textarea:focus,select:focus{border-color:#8daee0}.row{display:flex;gap:8px;flex-wrap:wrap}.choice{background:#f1f3f5;padding:10px 14px;border-radius:22px}.choice.active{background:var(--yellow);font-weight:800}.primary{width:100%;background:var(--green);color:#fff;padding:14px;border-radius:13px;font-weight:900;margin-top:12px}.secondary{width:100%;background:#eef0f2;padding:13px;border-radius:13px;font-weight:800;margin-top:8px}.warn{background:#fff3c4;padding:12px;border-radius:12px;font-size:12px;line-height:1.9}.info{background:var(--blue);padding:12px;border-radius:12px;font-size:12px;line-height:1.9}.successbox{background:#e8f8ee;padding:12px;border-radius:12px;font-size:12px;line-height:1.9}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.price{font-weight:900}.muted{color:var(--muted);font-size:12px}.total{font-size:20px;font-weight:900}.greenText{color:var(--green)}.redText{color:var(--red)}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#11151b;color:#b9bec7;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{background:transparent;color:inherit;padding:6px;font-size:11px}.nav button.active{color:var(--yellow);font-weight:900}.badge{padding:4px 8px;border-radius:10px;background:#e8f8ee;color:var(--green);font-size:11px}.backbtn{border:0;background:#eef1f3;color:#222;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}.screenTitle{position:relative;padding-top:4px}.screenTitle .backbtn{display:inline-block}
.screenTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.smallbtn{background:#f0f2f4;border-radius:10px;padding:7px 10px;font-size:12px}.danger{color:var(--red);background:#fff0f0}.success{background:#e8f8ee;color:var(--green)}.empty{padding:24px;text-align:center;color:var(--muted)}.mini{font-size:11px;color:var(--muted);line-height:1.8}.option{border:1px solid #e1e4e8;border-radius:14px;padding:12px;margin-top:9px}.option.selected{border:2px solid var(--green);background:#f6fff9}.optionHead{display:flex;justify-content:space-between;gap:8px}.pill{display:inline-block;background:#f0f2f4;padding:4px 7px;border-radius:8px;font-size:11px;margin:3px 2px}.qtybox{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:end}.hr{height:1px;background:var(--line);margin:12px 0}.checkline{display:flex;align-items:center;gap:9px;padding:11px 0}.checkline input{width:auto}.bigask{font-size:17px;font-weight:900;line-height:1.8}.stepbar{display:flex;gap:5px;margin-bottom:14px}.stepbar span{flex:1;height:6px;border-radius:9px;background:#e3e5e8}.stepbar span.on{background:var(--green)}.priceUnknown{color:#946200;font-size:11px}.choiceCard{border:1px solid #dfe3e7;border-radius:14px;padding:12px;margin-top:9px}.choiceCard.active{border:2px solid var(--green);background:#f6fff9}.remove{color:var(--red);background:#fff0f0;border-radius:9px;padding:6px 9px;font-size:11px}.modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}.modalCard{width:min(420px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}.modalCard h3{margin:0 0 10px}.modalCard p{color:var(--muted);line-height:1.8;margin:0 0 16px}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head>
<body><div class="app"><header><div class="brand">🍗 ال سوخاری<small>ایجنت فروش و سفارش‌یار — نسخه ۵.۲۴</small></div><div class="topnote">پیشنهاد → تأیید مشتری → تکمیل سفارش → وزن‌کشی → مبلغ دقیق</div></header><main id="content"></main>
<nav class="nav"><button data-page="home" onclick="show('home')">⌂<br>داشبورد</button><button data-page="orders" onclick="show('orders')">▤<br>سفارش‌ها</button><button data-page="customers" onclick="show('customers')">♙<br>مشتریان</button><button data-page="settings" onclick="show('settings')">⚙<br>تنظیمات</button></nav></div>
<script>
const products={
 'فیله استریپس':{price:1600,type:'weightCount',piece:'هر تکه حدود ۴۰ تا ۱۵۰ گرم',icon:'🍗'},
 'ران سوخاری':{price:1100,type:'weightCount',piece:'هر تکه حدود ۴۰ تا ۱۵۰ گرم',icon:'🍗'},
 'کتف و بال سوخاری':{price:1100,type:'weightCount',piece:'هر تکه حدود ۴۰ تا ۱۵۰ گرم',icon:'🍗'},
 'کوکتل پنیری':{price:1500,type:'weightCount',piece:'هر تکه حدود ۴۰ تا ۱۵۰ گرم',icon:'🌭'},
 'قارچ سوخاری':{price:890,type:'weight',piece:'هر مقدار',icon:'🍄'},
 'سیب‌زمینی سرخ‌کرده':{price:750,type:'weight',piece:'هر مقدار',icon:'🍟'},
 'سیب‌زمینی تنوری':{price:790,type:'weight',piece:'هر مقدار',icon:'🥔'},
 'چیکن پنیری':{price:1500,type:'weightCount',piece:'هر تکه حدود ۲۰ تا ۲۵ گرم',icon:'🧀'},
 'پیاز سوخاری':{price:850,type:'weightCount',piece:'هر تکه حدود ۲۰ تا ۳۰ گرم',icon:'🧅'},
 'کوردن بلو':{price:200,type:'item',piece:'هر عدد',icon:'🥩'},
 'سس سیر':{price:30,type:'item',piece:'هر عدد',icon:'🥣'},'سس چیلی تای':{price:30,type:'item',piece:'هر عدد',icon:'🌶️'},'سس باربیکیو':{price:30,type:'item',piece:'هر عدد',icon:'🥣'},
 'دیپ پنیر چدار':{price:80,type:'item',piece:'هر عدد',icon:'🧀'},'نوشابه خانواده':{price:122.1,type:'item',piece:'هر عدد',icon:'🥤'},'نوشابه قوطی':{price:95,type:'item',piece:'هر عدد',icon:'🥤'},'نوشابه پت کوچک':{price:55,type:'item',piece:'هر عدد',icon:'🥤'},'لیموناد شیشه':{price:72,type:'item',piece:'هر عدد',icon:'🍋'},'دوغ لیوانی':{price:35,type:'item',piece:'هر عدد',icon:'🥛'},'آب معدنی کوچک':{price:20,type:'item',piece:'هر عدد',icon:'💧'}
};
let state={page:'home',detailId:null,customerDetailPhone:null,people:4,budget:null,budgetMode:'max',likes:[],note:'',order:[],customer:{name:'',phone:''},orderType:'حضوری',stage:'new',orderMode:'smart',lastSaved:null,needsReweigh:false,budgetAdjustmentNote:'',budgetWarning:'',budgetOverride:false,editIndex:null,chickenPlan:[],sidesPlan:[],varietyPlan:[]};
function moneyK(k){return Math.round(k*1000).toLocaleString('fa-IR')+' تومان'}
function linePrice(x){const p=products[x.name];if(p.type==='weight'||p.type==='weightCount')return p.price*(x.finalWeight??x.qty)/1000;if(p.type==='item')return p.price*x.qty;return 0}
function totalK(){return state.order.reduce((s,x)=>s+linePrice(x),0)}
function backPage(){const map={new:'home',chicken:'new',sides:'chicken',sidesEdit:'sides',variety:'sides',varietyEdit:'variety',edit:(state.orderMode==='custom'?'new':'variety'),weigh:'edit',confirm:'weigh',receipt:'home',orders:'home',ordersAll:'orders',orderDetail:'orders',customers:'home',customerDetail:'customers',settings:'home',reports:'home'};show(map[state.page]||'home')}
function backButton(){return `<button class="backbtn" onclick="backPage()">‹ بازگشت</button>`}
function show(page){state.page=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=({home,new:newOrder,chicken:chickenConfirm,sides:sidesConfirm,sidesEdit:sidesEdit,variety:varietyConfirm,varietyEdit:varietyEdit,weigh,confirm:confirmOrder,receipt,edit:editOrder,orders,ordersAll,orderDetail,customers,customerDetail,settings,reports}[page]||home)();window.scrollTo(0,0);if(page==='weigh')setTimeout(previewWeights,0)}
function home(){let n=getOrders().filter(o=>o.date===todayKey()).length;return `<h2>سلام 👋</h2><div class="grid"><div class="tile yellow" onclick="startNew()"><b>➕ سفارش جدید</b><span>شروع سفارش مشتری</span></div><div class="tile blue" onclick="show('customers')"><b>👥 مشتریان</b><span>جست‌وجو و سفارش‌های قبلی</span></div><div class="tile green" onclick="show('orders')"><b>📋 سفارش‌های امروز</b><span>${n} سفارش ثبت‌شده</span></div><div class="tile purple" onclick="show('reports')"><b>📊 گزارش‌ها</b><span>فروش و عملکرد مغازه</span></div><div class="tile" style="background:#eef0f2" onclick="show('settings')"><b>⚙️ تنظیمات</b><span>محصولات و قوانین فروش</span></div></div><div class="card" style="margin-top:14px"><h3>منطق جدید سفارش‌یار</h3><div class="muted">اول مقدار مرغ، بعد سیب‌زمینی و قارچ، بعد تنوع و در پایان سس و نوشیدنی؛ هر مرحله با تأیید مشتری جلو می‌رود.</div><button class="primary" onclick="startNew()">ساخت پیشنهاد هوشمند 🤖</button></div>`}
function startNew(){state.order=[];state.likes=[];state.note='';state.customer={name:'',phone:''};state.orderType='حضوری';state.budget=null;state.budgetMode='max';state.needsReweigh=false;state.budgetAdjustmentNote='';state.budgetWarning='';state.budgetOverride=false;state.editIndex=null;state.orderMode='smart';state.chickenPlan=[];state.sidesPlan=[];state.varietyPlan=[];show('new')}
function startCustomOrder(){
  state.orderMode='custom';
  state.order=[];
  state.people=null;
  state.budget=null;
  state.budgetMode='max';
  state.likes=[];
  state.note='';
  show('edit');
}
function newOrder(){return `<div class="screenTitle"><h2>سفارش جدید</h2><button class="smallbtn" onclick="show('home')">بازگشت</button></div><div class="stepbar"><span class="on"></span><span></span><span></span><span></span></div><div class="card"><h3>👤 اطلاعات مشتری</h3><label>شماره موبایل</label><input inputmode="tel" value="${esc(state.customer.phone)}" placeholder="مثلاً 0912..." oninput="state.customer.phone=this.value"><label>نام مشتری (اختیاری)</label><input value="${esc(state.customer.name)}" placeholder="مثلاً احمد" oninput="state.customer.name=this.value"><label>نوع سفارش</label><div class="row">${['حضوری','بیرون‌بر','ارسال'].map(x=>`<button class="choice ${state.orderType===x?'active':''}" onclick="state.orderType='${x}';show('new')">${x}</button>`).join('')}</div></div><div class="card"><label>تعداد نفرات</label><div class="row">${[1,2,3,4,5,6,8,10].map(x=>`<button class="choice ${Number(state.people)===x?'active':''}" onclick="state.people=${x};show('new')">${x}</button>`).join('')}</div><label>بودجه — اختیاری</label><input type="number" min="0" value="${state.budget??''}" placeholder="اگر بودجه‌ای ندارید خالی بگذارید" oninput="state.budget=this.value===''?null:+this.value"><div class="row" style="margin-top:8px">${[['max','حداکثر'],['around','حدود']].map(a=>`<button class="choice ${state.budgetMode===a[0]?'active':''}" onclick="state.budgetMode='${a[0]}';show('new')">${a[1]}</button>`).join('')}</div><label>سلیقه مشتری</label><div class="row">${['فیله بیشتر','استخوان‌دار بیشتر','مرغ کمتر','تنوع زیاد','پنیری'].map(x=>`<button class="choice ${state.likes.includes(x)?'active':''}" onclick="toggleLike('${x}')">${x}</button>`).join('')}</div><label>توضیحات یا محدودیت</label><textarea rows="3" placeholder="مثلاً دو نفر کم‌خوراک‌اند / فیله دوست دارند" oninput="state.note=this.value">${esc(state.note)}</textarea>
<button class="primary" onclick="state.orderMode='smart';buildChickenPlan()">پیشنهاد هوشمند 🍗</button>
<button class="secondary" onclick="startCustomOrder()">✋ سفارش دلخواه مشتری</button>
<div class="info" style="margin-top:10px">اگر مشتری خودش دقیقاً می‌داند چه می‌خواهد، «سفارش دلخواه مشتری» را بزنید تا بدون پیشنهاد خودکار، اقلام و تعداد/وزن را مستقیم وارد کنید.</div>
</div>`}
function toggleLike(x){state.likes=state.likes.includes(x)?state.likes.filter(a=>a!==x):[...state.likes,x];show('new')}
function baseForPeople(n){const f=Math.max(1,Math.round(4*n/4));const r=Math.max(0,Math.round(2*n/4));const w=Math.max(1,Math.round(4*n/4));return {fillet:f,ran:r,wings:w}}
function adjustChickenForTaste(base){let x={...base};if(state.likes.includes('فیله بیشتر')){x.fillet+=Math.max(1,Math.round(x.ran/2));x.ran=Math.max(0,x.ran-1);x.wings=Math.max(1,x.wings-1)}if(state.likes.includes('استخوان‌دار بیشتر')){x.ran+=1;x.wings+=Math.max(1,Math.round(x.fillet/4));x.fillet=Math.max(1,x.fillet-1)}if(state.likes.includes('مرغ کمتر')||/مرغ\s*(کم|زیاد ن?می)/.test(state.note)){x.fillet=Math.max(1,Math.round(x.fillet*.75));x.ran=Math.max(0,Math.round(x.ran*.75));x.wings=Math.max(1,Math.round(x.wings*.75))}return x}
function buildChickenPlan(){state.chickenPlan=adjustChickenForTaste(baseForPeople(Number(state.people)||4));show('chicken')}
function chickenConfirm(){const p=state.chickenPlan;return `<div class="screenTitle">${backButton()}<h2>🍗 مرحله ۱: مقدار مرغ</h2></div><div class="stepbar"><span class="on"></span><span></span><span></span><span></span></div><div class="card"><div class="bigask">برای ${state.people} نفر، این ترکیب رو پیشنهاد می‌کنم:</div><div class="item"><span>🍗 فیله استریپس</span><b>${p.fillet} عدد</b></div><div class="item"><span>🍗 ران سوخاری</span><b>${p.ran} عدد</b></div><div class="item"><span>🍗 کتف و بال سوخاری</span><b>${p.wings} عدد</b></div><div class="info" style="margin-top:12px">قیمت دقیق این اقلام چون دانه‌ای سفارش می‌شوند، بعد از وزن‌کشی مشخص می‌شود.</div><p class="bigask" style="margin-top:16px">این مقدار مرغ براتون کافیه یا بیشتر میل دارید؟</p><button class="primary" onclick="acceptChicken()">کافیه، بریم مرحله بعد</button><button class="secondary" onclick="moreChicken()">بیشتر می‌خوایم 🍗</button><button class="secondary" onclick="chickenLess()">کمی کمتر</button></div>`}
function acceptChicken(){state.order=[];[['فیله استریپس',state.chickenPlan.fillet],['ران سوخاری',state.chickenPlan.ran],['کتف و بال سوخاری',state.chickenPlan.wings]].forEach(([n,q])=>{if(q>0)state.order.push({name:n,qty:q,mode:'count',count:q,finalWeight:null})});buildSidesPlan();}
function moreChicken(){
  state.chickenPlan.fillet += 1;
  state.chickenPlan.wings += 1;
  if (state.chickenPlan.fillet % 2 === 0) state.chickenPlan.ran += 1;
  show('chicken');
}
function chickenLess(){
  if (state.chickenPlan.fillet > 1) {
    state.chickenPlan.fillet -= 1;
    state.chickenPlan.wings = Math.max(1, state.chickenPlan.wings - 1);
    if (state.chickenPlan.fillet % 2 === 1) state.chickenPlan.ran = Math.max(1, state.chickenPlan.ran - 1);
  }
  show('chicken');
}
function buildSidesPlan(){const n=Number(state.people)||4;state.sidesPlan={potato:Math.max(50,Math.round(n*100)),mushroom:Math.max(50,Math.round(n*100))};show('sides')}
function sidesConfirm(){const s=state.sidesPlan;return `<div class="screenTitle">${backButton()}<h2>🍟 مرحله ۲: دورچین</h2></div><div class="stepbar"><span class="on"></span><span class="on"></span><span></span><span></span></div><div class="card"><div class="bigask">برای ${state.people} نفر، حدود ۱۰۰ گرم برای هر نفر در نظر گرفتم:</div><div class="item"><span>🍟 سیب‌زمینی سرخ‌کرده</span><b>${s.potato} گرم</b></div><div class="item"><span>🍄 قارچ سوخاری</span><b>${s.mushroom} گرم</b></div><div class="info" style="margin-top:12px">مقدارها تقریبی‌اند و می‌تونیم کمتر یا بیشترشون کنیم؛ معمولاً بیشتر از ۱۰۰ گرم برای هر نفر پیشنهاد نمی‌دیم مگر اینکه خودتون بخواید.</div><p class="bigask" style="margin-top:16px">این مقدار سیب‌زمینی و قارچ مناسبه؟</p><button class="primary" onclick="acceptSides()">بله، مناسبه</button><button class="secondary" onclick="changeSides()">✏️ تغییر مقدار</button><button class="secondary danger" onclick="skipSides()">❌ اینا رو نمی‌خوایم</button></div>`}
function changeSides(){const s=state.sidesPlan;show('sidesEdit')}
function sidesEdit(){const s=state.sidesPlan;return `<div class="screenTitle">${backButton()}<h2>✏️ تغییر مقدار دورچین</h2></div><div class="card"><div class="info">مقدار هر کدوم رو که می‌خواید تغییر بدید وارد کنید. می‌تونید صفر هم بزنید.</div><label>🍟 سیب‌زمینی سرخ‌کرده (گرم)</label><input id="editPotato" type="number" min="0" value="${s.potato}"><label>🍄 قارچ سوخاری (گرم)</label><input id="editMushroom" type="number" min="0" value="${s.mushroom}"><button class="primary" onclick="saveSidesEdit()">تأیید مقدار جدید</button><button class="secondary" onclick="show('sides')">انصراف</button></div>`}
function saveSidesEdit(){const s=state.sidesPlan;const potato=+document.getElementById('editPotato').value;const mushroom=+document.getElementById('editMushroom').value;if(!Number.isFinite(potato)||!Number.isFinite(mushroom)||potato<0||mushroom<0){alert('لطفاً مقدار معتبر وارد کنید.');return;}s.potato=Math.round(potato);s.mushroom=Math.round(mushroom);show('sides')}
function skipSides(){state.sidesPlan.potato=0;state.sidesPlan.mushroom=0;acceptSides()}
function acceptSides(){if(state.sidesPlan.potato>0)state.order.push({name:'سیب‌زمینی سرخ‌کرده',qty:state.sidesPlan.potato,mode:'weight',finalWeight:null});if(state.sidesPlan.mushroom>0)state.order.push({name:'قارچ سوخاری',qty:state.sidesPlan.mushroom,mode:'weight',finalWeight:null});buildVariety();}
function varietyBase(n){const scale=Math.max(.5,n/4);return {cocktail:Math.max(0,Math.round(2*scale)),balls:Math.max(0,Math.round(4*scale)),onion:Math.max(0,Math.round(3*scale)),cordon:n>=4?Math.max(1,Math.round(scale)):0}}
function buildVariety(){let v=varietyBase(Number(state.people)||4);if(state.likes.includes('تنوع زیاد')){v.cocktail+=1;v.balls+=1;v.onion+=1}if(state.likes.includes('پنیری')){v.cocktail+=1;v.balls+=1}state.varietyPlan=v;show('variety')}

function addCount(name, qty){
  qty = Number(qty || 0);
  if (qty <= 0) return;
  const product = products[name];
  if (!product) return;

  const existing = state.order.find(x => x.name === name);
  if (existing) {
    existing.qty = Number(existing.qty || 0) + qty;
    if (existing.count != null) existing.count = Number(existing.count || 0) + qty;
  } else {
    state.order.push({
      name: name,
      qty: qty,
      mode: product.type === 'item' ? 'item' : 'count',
      count: product.type === 'item' ? null : qty,
      finalWeight: null
    });
  }
}

function acceptVariety(){const v=state.varietyPlan;addCount('کوکتل پنیری',v.cocktail);addCount('چیکن پنیری',v.balls);addCount('پیاز سوخاری',v.onion);if(v.cordon)addCount('کوردن بلو',v.cordon);buildExtras()}

function buildExtras(){show('edit')}
function estimatedLinePrice(x){
  const p=products[x.name];
  if(p.type==='item') return linePrice(x);
  if(x.finalWeight&&Number(x.finalWeight)>0) return p.price*Number(x.finalWeight)/1000;
  if(p.type==='weightCount'){
    const avg={
      'فیله استریپس':95,
      'ران سوخاری':95,
      'کتف و بال سوخاری':95,
      'کوکتل پنیری':95,
      'چیکن پنیری':22.5,
      'پیاز سوخاری':25
    }[x.name]||50;
    return p.price*avg*Number(x.count||x.qty||0)/1000;
  }
  return p.price*Number(x.qty||0)/1000;
}
function budgetPrecheck(){
  if(state.orderMode==='custom'||state.budget==null) return true;
  const budget=+state.budget;
  const estimate=state.order.reduce((s,x)=>s+estimatedLinePrice(x),0);
  if(estimate<=budget+0.0001){state.budgetWarning='';state.budgetOverride=false;return true;}
  const over=estimate-budget;
  const items=state.order.map(x=>products[x.name].type==='item'?`${x.name} (${x.qty} عدد)`:(x.count?`${x.name} (${x.count} عدد)`:x.name)).join('، ');
  const kind=state.budgetMode==='around'?'بودجه حدودی':'سقف بودجه';
  state.budgetWarning=state.budgetMode==='around'
    ?`⚠️ این ترکیب با وزن‌های معمول احتمالاً حدود ${moneyK(estimate)} می‌شود؛ یعنی حدود ${moneyK(over)} بیشتر از بودجه حدودی ${moneyK(budget)}.\n\nاگر دوست دارید، می‌توانید همین حالا سفارش را تغییر دهید؛ یا اگر این مقدار برایتان قابل قبول است، ادامه بدهید تا وزن‌کشی و مبلغ واقعی مشخص شود.\n\nاقلام فعلی: ${items}`
    :`⚠️ این ترکیب با وزن‌های معمول احتمالاً حدود ${moneyK(estimate)} می‌شود؛ یعنی حدود ${moneyK(over)} بالاتر از سقف ${moneyK(budget)}.\n\nاگر می‌خواهید داخل بودجه بمانیم، سفارش را تغییر دهید؛ اگر مشتری تأیید کند که با مبلغ بیشتر ادامه دهیم، می‌توانیم وارد وزن‌کشی شویم و مبلغ واقعی را مشخص کنیم.\n\nاقلام فعلی: ${items}`;
  return false;
}

}

function previewWeights(){let total=0,complete=true;for(let i=0;i<state.order.length;i++){const x=state.order[i],p=products[x.name],priceEl=document.getElementById('p'+i);if(p.type==='item'){total+=linePrice(x);continue;}const el=document.getElementById('w'+i),w=+(el?.value||0);if(w>0){const price=p.price*w/1000;total+=price;if(priceEl)priceEl.textContent='قیمت فعلی: '+moneyK(price);}else{complete=false;if(priceEl)priceEl.textContent='قیمت فعلی: —';}}const totalEl=document.getElementById('liveTotal'),statusEl=document.getElementById('liveBudgetStatus');if(totalEl)totalEl.textContent=complete?moneyK(total):'—';if(statusEl){if(!complete)statusEl.textContent='هنوز وزن همه اقلام وارد نشده است.';else if(state.orderMode!=='custom'&&state.budget!=null&&state.budgetMode==='max'&&total>state.budget)statusEl.textContent='⚠️ '+moneyK(total-state.budget)+' بیشتر از سقف بودجه است.';else if(state.orderMode!=='custom'&&state.budget!=null&&state.budgetMode==='around'&&total>state.budget)statusEl.textContent='مبلغ کمی بیشتر از بودجه حدودی است.';else statusEl.textContent='مبلغ با وزن‌های فعلی محاسبه شد.';}}

function suggestAdjustment(){
  if(state.budget==null)return false;
  const budget=+state.budget, current=totalK();
  if(current<=budget+0.0001)return true;

  // V5.14: قبل از اعلام «غیرممکن»، همه اقلام قابل تنظیم را بررسی می‌کنیم.
  // اقلام دانه‌ای با کاهش تعداد و وزن متناسب با وزن فعلی بررسی می‌شوند؛
  // اقلام وزنی می‌توانند تا ۵۰ گرم یا صفر (حذف کامل) تنظیم شوند.
  const adjustable=state.order.filter(x=>products[x.name].type!=='item');
  const countItems=adjustable.filter(x=>products[x.name].type==='weightCount'&&x.count&&Number(x.finalWeight||0)>0);
  const weightItems=adjustable.filter(x=>products[x.name].type!=='item'&&products[x.name].type!=='weightCount');

  const ranges=[];
  for(const x of countItems){
    const c=Number(x.count), w=Number(x.finalWeight||0), arr=[];
    for(let n=c;n>=1;n--){
      const ww=Math.round(w*n/c);
      arr.push({count:n,weight:ww});
    }
    ranges.push({x,arr});
  }
  for(const x of weightItems){
    const cur=Number(x.finalWeight||x.qty||0), arr=[];
    for(let ww=cur;ww>=50;ww-=25)arr.push({weight:ww});
    if(cur>=50)arr.push({weight:0});
    ranges.push({x,arr});
  }

  // Nothing except fixed-price items can be adjusted.
  if(!ranges.length)return false;

  let best=null, checked=0;
  function walk(i,plan,total,score){
    if(checked++>250000)return;
    if(i===ranges.length){
      if(total>budget+0.0001)return;
      const gap=budget-total;
      // اول کمترین تعداد تغییر؛ سپس کمترین دوری از سقف؛ سپس توزیع متعادل کاهش.
      const reductions=plan.reduce((s,a)=>s+(a.reduction||0),0);
      const imbalance=plan.reduce((s,a)=>s+(a.fraction||0)*(a.fraction||0),0);
      const key=[reductions,gap,imbalance];
      if(!best||key[0]<best.key[0]||(key[0]===best.key[0]&&(key[1]<best.key[1]-0.0001||(Math.abs(key[1]-best.key[1])<0.0001&&key[2]<best.key[2]))))best={plan,total,key};
      return;
    }
    const {x,arr}=ranges[i],p=products[x.name],baseW=Number(x.finalWeight||x.qty||0),baseC=Number(x.count||0);
    for(const opt of arr){
      let line;
      if(p.type==='weightCount')line=p.price*opt.weight/1000;
      else line=p.price*opt.weight/1000;
      const oldLine=linePrice(x), reduction=Math.max(0,oldLine-line);
      if(total+line>budget+current)continue;
      const fraction=baseW>0?Math.max(0,(baseW-opt.weight)/baseW):0;
      walk(i+1,plan.concat([{x,opt,reduction:(opt.count?baseC-opt.count:0),fraction}]),total+line,score+reduction);
    }
  }

  // Fixed-price items stay untouched; start from their current total.
  const fixedTotal=state.order.filter(x=>products[x.name].type==='item').reduce((s,x)=>s+linePrice(x),0);
  walk(0,[],fixedTotal,0);
  if(!best)return false;

  let changed=false, countChanged=false;
  for(const a of best.plan){
    const x=a.x,p=products[x.name],o=a.opt;
    if(p.type==='weightCount'){
      if(Number(x.count)!==Number(o.count)||Number(x.finalWeight)!==Number(o.weight)){
        x.count=o.count;x.qty=o.count;x.finalWeight=o.weight;changed=true;countChanged=true;
      }
    }else if(Number(x.finalWeight||x.qty)!==Number(o.weight)){
      x.finalWeight=o.weight;changed=true;
    }
  }
  state.needsReweigh=changed;
  state.budgetAdjustmentNote=countChanged?'برای رسیدن به سقف بودجه، تعداد بعضی اقلام دانه‌ای هم تنظیم شده؛ لطفاً وزن‌کشی را دوباره انجام دهید.':'مقدار بعضی اقلام برای رسیدن به سقف بودجه تنظیم شده؛ لطفاً وزن‌کشی را دوباره انجام دهید.';
  return changed;
}
function applyBudgetAdjustment(){
  if(!suggestAdjustment())return alert('با بررسی همه ترکیب‌های منطقی، رسیدن به سقف بودجه ممکن نشد.');
  show('weigh');
}
function confirmOrder(){const t=totalK(),over=overBudget(),around=state.budget!=null&&state.budgetMode==='around',custom=state.orderMode==='custom';return `<div class="screenTitle">${backButton()}<h2>✅ تأیید نهایی</h2></div><div class="card">${custom?'':'<div class="item"><span>تعداد نفرات</span><b>'+state.people+'</b></div><div class="item"><span>بودجه</span><b>'+budgetText()+'</b></div>'}${state.order.map(x=>`<div class="item"><span>${products[x.name].icon} ${x.name}<div class="mini">${displayOrderQty(x)}</div></span><b>${moneyK(linePrice(x))}</b></div>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:15px"><span class="total">مبلغ نهایی</span><span class="total">${moneyK(t)}</span></div>${over?`<div class="warn redText" style="margin-top:12px">⚠️ مبلغ واقعی ${moneyK(t)} است و ${moneyK(t-state.budget)} از سقف ${moneyK(state.budget)} بیشتر شده.</div><button class="primary" onclick="state.budgetOverride=true;saveOrder()">✅ مشتری تأیید کرد؛ ثبت با همین مبلغ</button><button class="secondary" onclick="state.budgetOverride=false;show('edit')">✏️ تغییر سفارش</button>`:around&&t>state.budget?`<div class="warn" style="margin-top:12px">مبلغ نهایی کمی بیشتر از بودجه حدودی شماست. دوست دارید کمترش کنیم یا همین مقدار مورد تأییده؟</div><button class="primary" onclick="saveOrder()">همین مقدار تأییده</button><button class="secondary" onclick="show('edit')">کمترش کنیم</button>`:`<div class="successbox greenText" style="margin-top:12px">✅ مبلغ نهایی مورد تأیید اولیه است.</div><button class="primary" onclick="saveOrder()">ثبت نهایی سفارش</button>`}<button class="secondary" onclick="show('edit')">✏️ ویرایش سفارش</button></div>`}
function saveOrder(){if(!state.order.length){alert('سفارش خالی است.');return;}if(overBudget()&&!state.budgetOverride){alert('مبلغ سفارش از سقف بودجه بیشتر است. اگر مشتری تأیید کرده، گزینه «ثبت با همین مبلغ» را بزنید.');return;}const now=new Date(),arr=getOrders(),id=nextOrderId(arr),saved={id,time:now.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),date:todayKey(now),createdAt:now.toISOString(),total:Math.round(totalK()*1000),items:JSON.parse(JSON.stringify(state.order)),people:state.people,status:'در انتظار',customer:{...state.customer},orderType:state.orderType,budget:state.budget,budgetMode:state.budgetMode};arr.unshift(saved);setOrders(arr);if(state.customer.phone){let cs=getCustomers(),c=cs.find(x=>x.phone===state.customer.phone);if(!c)c={phone:state.customer.phone,name:state.customer.name||'بدون نام',orders:0,totalSpent:0,history:[]};c.name=state.customer.name||c.name||'بدون نام';c.orders=(c.orders||0)+1;c.totalSpent=(c.totalSpent||0)+saved.total;c.lastOrderTotal=saved.total;c.lastOrderAt=saved.time;c.history=(c.history||[]).concat([{id:saved.id,date:saved.date,total:saved.total,time:saved.time,status:saved.status,items:saved.items}]);cs=cs.filter(x=>x.phone!==state.customer.phone);cs.unshift(c);setCustomers(cs)}state.lastSaved=saved;alert('سفارش #'+id+' با موفقیت ثبت شد. ✅');state.order=[];show('receipt')}
function receipt(){const o=state.lastSaved;if(!o)return '<div class="card empty">سفارشی برای نمایش وجود ندارد.</div>';return `<div class="screenTitle"><h2>🧾 رسید سفارش #${o.id}</h2></div><div class="card"><div class="successbox greenText">✅ سفارش با موفقیت ثبت شد.</div><div class="item"><span>زمان</span><b>${o.time}</b></div><div class="item"><span>نوع سفارش</span><b>${esc(o.orderType||'حضوری')}</b></div>${o.customer?.name?`<div class="item"><span>مشتری</span><b>${esc(o.customer.name)}</b></div>`:''}${o.items.map(x=>`<div class="item"><span>${products[x.name].icon} ${x.name}<div class="mini">${displayOrderQty(x)}</div></span><b>${moneyK(linePrice(x))}</b></div>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:15px"><span class="total">مبلغ نهایی</span><span class="total">${moneyK(o.total/1000)}</span></div><button class="primary" onclick="startNew()">➕ سفارش جدید</button><button class="secondary" onclick="show('orders')">📋 سفارش‌های امروز</button></div>`}
function getOrders(){return JSON.parse(localStorage.getItem('alsokhari_orders_v5')||'[]')}function setOrders(a){localStorage.setItem('alsokhari_orders_v5',JSON.stringify(a))}function getCustomers(){return JSON.parse(localStorage.getItem('alsokhari_customers_v5')||'[]')}function setCustomers(a){localStorage.setItem('alsokhari_customers_v5',JSON.stringify(a))}function todayKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function nextOrderId(a){return a.reduce((m,o)=>Math.max(m,Number(o.id)||999),999)+1}
function syncCustomerOrderStatus(order){if(!order?.customer?.phone)return;let cs=getCustomers(),c=cs.find(x=>x.phone===order.customer.phone);if(!c)return;c.history=(c.history||[]).map(h=>h.id===order.id?{...h,status:order.status}:h);setCustomers(cs)}
function setStatus(id,status){let a=getOrders(),o=a.find(x=>x.id===id);if(o){o.status=status;setOrders(a);syncCustomerOrderStatus(o);show('orders')}}
function cancelOrder(id){const o=getOrders().find(x=>x.id===id);if(!o)return;if(o.status==='لغو شد'){alert('این سفارش قبلاً لغو شده است.');return;}state.cancelPending=id;state.detailId=id;show('orderDetail')}
function confirmCancelOrder(){const id=state.cancelPending;if(id==null)return;let a=getOrders(),o=a.find(x=>x.id===id);if(!o)return;if(o.status==='لغو شد'){state.cancelPending=null;show('orders');return;}o.status='لغو شد';o.cancelledAt=new Date().toISOString();setOrders(a);syncCustomerOrderStatus(o);state.cancelPending=null;show('orders')}
function dismissCancelOrder(){state.cancelPending=null;show('orderDetail')}
function orderDetail(id=state.detailId){const o=getOrders().find(x=>x.id===id);if(!o)return '<div class="card empty">سفارش پیدا نشد.</div>';return `<div class="screenTitle">${backButton()}<h2>🧾 جزئیات سفارش #${o.id}</h2></div><div class="card"><div class="item"><span>وضعیت</span><b>${esc(o.status)}</b></div><div class="item"><span>تاریخ / ساعت</span><b>${esc(o.date||'-')} | ${esc(o.time||'-')}</b></div>${o.people?`<div class="item"><span>تعداد نفرات</span><b>${o.people}</b></div>`:''}${o.customer?.name?`<div class="item"><span>مشتری</span><b>${esc(o.customer.name)}</b></div>`:''}${o.customer?.phone?`<div class="item"><span>شماره تماس</span><b>${esc(o.customer.phone)}</b></div>`:''}${o.budget!=null?`<div class="item"><span>بودجه</span><b>${o.budgetMode==='around'?'حدود':'سقف'} ${moneyK(o.budget)}</b></div>`:''}<h3 style="margin-top:14px">اقلام</h3>${o.items.map(x=>`<div class="item"><span>${products[x.name].icon} ${x.name}<div class="mini">${displayOrderQty(x)}</div></span><b>${moneyK(linePrice(x))}</b></div>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:15px"><span class="total">مبلغ سفارش</span><span class="total">${moneyK(o.total/1000)}</span></div>${o.status!=='لغو شد'?`<button class="danger secondary" onclick="cancelOrder(${o.id})">🗑️ لغو سفارش</button>`:''}</div>${state.cancelPending===o.id?`<div class="modalBackdrop"><div class="modalCard"><h3>لغو سفارش #${o.id}؟</h3><p>با تأیید، این سفارش لغو می‌شود.</p><div class="modalActions"><button class="secondary" onclick="dismissCancelOrder()">خیر، برگرد</button><button class="danger secondary" onclick="confirmCancelOrder()">بله، لغو کن</button></div></div></div>`:''}`}
function orders(){const arr=getOrders().filter(o=>o.date===todayKey()),active=arr.filter(o=>o.status!=='لغو شد'),sum=active.reduce((s,o)=>s+(o.total||0),0);return `<div class="screenTitle">${backButton()}<h2>📋 سفارش‌های امروز</h2><span class="badge">${arr.length} سفارش</span></div><div class="card"><div class="item"><span>تعداد سفارش امروز</span><b>${arr.length}</b></div><div class="item"><span>فروش ثبت‌شده امروز</span><b>${moneyK(sum/1000)}</b></div>${arr.length-active.length?`<div class="mini redText">${arr.length-active.length} سفارش لغو شده و در فروش امروز محاسبه نشده.</div>`:''}</div>${arr.length?arr.map(o=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>#${o.id}</b><span class="badge">${o.status}</span></div><div class="muted">${o.time} | ${o.people?o.people+' نفر | ':''}${o.orderType||'حضوری'}${o.customer?.name?' | '+esc(o.customer.name):''}</div><p>${o.items.map(x=>x.name).join('، ')}</p><b>${moneyK(o.total/1000)}</b><div class="row" style="margin-top:10px"><button class="smallbtn" onclick="state.detailId=${o.id};show('orderDetail')">👁 جزئیات</button>${['در انتظار','در حال آماده‌سازی','آماده','تحویل شد'].map(st=>`<button class="smallbtn ${o.status===st?'success':''}" onclick="setStatus(${o.id},'${st}')">${st}</button>`).join('')}${o.status!=='لغو شد'?`<button class="smallbtn danger" onclick="cancelOrder(${o.id})">لغو</button>`:''}</div></div>`).join(''):'<div class="card empty">امروز هنوز سفارشی ثبت نشده.</div>'}<button class="secondary" onclick="show('ordersAll')">📚 همه سفارش‌ها</button>`}
function ordersAll(){const arr=getOrders();return `<div class="screenTitle">${backButton()}<h2>📚 همه سفارش‌ها</h2><button class="smallbtn" onclick="show('orders')">امروز</button></div>${arr.length?arr.map(o=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>#${o.id}</b><span class="badge">${o.status}</span></div><div class="muted">${o.date||'-'} | ${o.time||'-'} | ${o.customer?.name?esc(o.customer.name):'بدون نام'}</div><div class="mini">${o.items.map(x=>x.name).join('، ')}</div><b>${moneyK((o.total||0)/1000)}</b><button class="secondary" onclick="state.detailId=${o.id};show('orderDetail')">👁 مشاهده جزئیات</button></div>`).join(''):'<div class="card empty">هنوز سفارشی ثبت نشده.</div>'}`}
function customers(){let cs=getCustomers();return `<div class="screenTitle">${backButton()}<h2>👥 مشتریان</h2><span class="badge">${cs.length} مشتری</span></div><div class="card"><input id="customerSearch" oninput="renderCustomerList()" placeholder="جست‌وجو با شماره یا نام"><div id="customerList" style="margin-top:10px">${customerListHtml(cs)}</div></div>`}
function customerListHtml(cs){return cs.length?cs.map(c=>`<div class="card" style="margin:8px 0;cursor:pointer" onclick="state.customerDetailPhone='${esc(c.phone)}';show('customerDetail')"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span><b>👤 ${esc(c.name)}</b><div class="mini">${esc(c.phone)} | ${c.orders||0} سفارش | آخرین: ${c.lastOrderAt||'-'}</div></span><b>${c.lastOrderTotal?moneyK(c.lastOrderTotal/1000):'-'}</b></div><div class="mini" style="margin-top:6px">مجموع خرید: ${c.totalSpent?moneyK(c.totalSpent/1000):'-'} • مشاهده سابقه ›</div></div>`).join(''):'<div class="empty">هنوز مشتری ثبت نشده.</div>'}
function renderCustomerList(){const el=document.getElementById('customerSearch');if(!el)return;let q=(el.value||'').trim();let cs=getCustomers().filter(c=>(c.phone||'').includes(q)||(c.name||'').includes(q));document.getElementById('customerList').innerHTML=customerListHtml(cs)}
function customerDetail(phone=state.customerDetailPhone){const c=getCustomers().find(x=>x.phone===phone);if(!c)return `<div class="card empty">مشتری پیدا نشد.</div>`;const history=(c.history||[]).slice().reverse();return `<div class="screenTitle">${backButton()}<h2>👤 ${esc(c.name||'بدون نام')}</h2></div><div class="card"><div class="item"><span>شماره موبایل</span><b>${esc(c.phone)}</b></div><div class="item"><span>تعداد سفارش</span><b>${c.orders||0}</b></div><div class="item"><span>مجموع خرید</span><b>${c.totalSpent?moneyK(c.totalSpent/1000):'-'}</b></div></div><div class="card"><h3>📚 سابقه سفارش‌ها</h3>${history.length?history.map(h=>`<div class="item"><span><b>#${h.id}</b><div class="mini">${esc(h.date||'-')} | ${esc(h.time||'-')} | ${esc(h.status||'در انتظار')}<br>${(h.items||[]).map(x=>esc(x.name)).join('، ')}</div></span><b>${moneyK((h.total||0)/1000)}</b></div>`).join(''):'<div class="empty">سابقه‌ای ثبت نشده.</div>'}</div><button class="primary" onclick="startNew();state.customer.phone='${esc(c.phone)}';state.customer.name='${esc(c.name||'')}';show('new')">➕ سفارش جدید برای این مشتری</button>`}
function reportDateOffset(days){const d=new Date();d.setDate(d.getDate()+days);return todayKey(d)}
function reportRange(mode){const end=todayKey();if(mode==='day')return {label:'امروز',start:end,end};if(mode==='week')return {label:'۷ روز اخیر',start:reportDateOffset(-6),end};const d=new Date();const start=new Date(d.getFullYear(),d.getMonth(),1);return {label:'این ماه',start:todayKey(start),end};}
function reports(){const mode=state.reportMode||'day',r=reportRange(mode),all=getOrders(),active=all.filter(o=>o.status!=='لغو شد'&&o.date>=r.start&&o.date<=r.end),sales=active.reduce((s,o)=>s+(o.total||0),0),avg=active.length?sales/active.length:0;
let phones=[...new Set(active.map(o=>o.customer?.phone).filter(Boolean))],newC=0,oldC=0;phones.forEach(phone=>{const first=all.filter(o=>o.status!=='لغو شد'&&o.customer?.phone===phone).sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];if(first&&first.date>=r.start&&first.date<=r.end)newC++;else oldC++;});
const itemMap={};active.forEach(o=>(o.items||[]).forEach(x=>{const revenue=linePrice(x);if(!itemMap[x.name])itemMap[x.name]={name:x.name,revenue:0,count:0};itemMap[x.name].revenue+=revenue;itemMap[x.name].count+=(products[x.name]?.type==='item'?(x.qty||0):(x.count||1));}));
const top=Object.values(itemMap).sort((a,b)=>b.revenue-a.revenue).slice(0,5),maxTop=top[0]?.revenue||1;
let days=[];if(mode==='day'){days=[{key:r.end,label:'امروز'}]}else{let cur=new Date(r.start+'T00:00:00');const end=new Date(r.end+'T00:00:00');while(cur<=end){days.push({key:todayKey(cur),label:cur.toLocaleDateString('fa-IR',{day:'numeric',month:'short'})});cur.setDate(cur.getDate()+1);}}
const daily=days.map(d=>{const os=active.filter(o=>o.date===d.key),v=os.reduce((s,o)=>s+(o.total||0),0);return {...d,count:os.length,value:v};});const maxDay=Math.max(...daily.map(x=>x.value),1);
return `<div class="screenTitle">${backButton()}<h2>📊 گزارش‌ها</h2></div><div class="row" style="margin-bottom:12px"><button class="choice ${mode==='day'?'active':''}" onclick="state.reportMode='day';show('reports')">امروز</button><button class="choice ${mode==='week'?'active':''}" onclick="state.reportMode='week';show('reports')">۷ روز اخیر</button><button class="choice ${mode==='month'?'active':''}" onclick="state.reportMode='month';show('reports')">این ماه</button></div><div class="card"><h3>💰 خلاصه ${r.label}</h3><div class="item"><span>فروش ثبت‌شده</span><b>${moneyK(sales/1000)}</b></div><div class="item"><span>تعداد سفارش</span><b>${active.length}</b></div><div class="item"><span>میانگین مبلغ هر سفارش</span><b>${active.length?moneyK(avg/1000):'-'}</b></div></div><div class="card"><h3>👥 مشتریان</h3><div class="item"><span>مشتری جدید</span><b>${newC}</b></div><div class="item"><span>مشتری قدیمی</span><b>${oldC}</b></div><div class="mini">مبنای این بخش شماره موبایل ثبت‌شده برای سفارش‌هاست.</div></div><div class="card"><h3>🏆 پرفروش‌ترین آیتم‌ها</h3>${top.length?top.map((x,i)=>`<div class="item"><span>${i+1}. ${products[x.name]?.icon||'🍗'} ${esc(x.name)}<div class="mini">${x.count} عدد/ثبت • ${moneyK(x.revenue/1000)}</div><div style="height:7px;background:#edf0f2;border-radius:8px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${Math.max(8,Math.round(x.revenue/maxTop*100))}%;background:#ffc928;border-radius:8px"></div></div></span><b>${moneyK(x.revenue/1000)}</b></div>`).join(''):'<div class="empty">در این بازه سفارشی ثبت نشده.</div>'}</div><div class="card"><h3>📈 فروش روزانه</h3>${daily.map(d=>`<div class="item"><span>${d.label}<div class="mini">${d.count} سفارش</div><div style="height:7px;background:#edf0f2;border-radius:8px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${d.value?Math.max(5,Math.round(d.value/maxDay*100)):0}%;background:#16a35a;border-radius:8px"></div></div></span><b>${d.value?moneyK(d.value/1000):'-'}</b></div>`).join('')}</div><div class="card"><div class="mini">سفارش‌های لغوشده در فروش این گزارش محاسبه نشده‌اند.</div></div>`}
function settings(){return `<div class="screenTitle">${backButton()}<h2>⚙️ تنظیمات</h2></div><div class="card"><h3>قیمت‌های فعال</h3>${Object.entries(products).map(([n,p])=>`<div class="item"><span>${p.icon} ${n}<div class="mini">${p.type==='weight'?'کیلویی':p.type==='weightCount'?'کیلویی؛ امکان سفارش دانه‌ای و وزن‌کشی نهایی':'هر عدد'}</div></span><span>${p.type==='item'?moneyK(p.price):moneyK(p.price)+' / کیلو'}</span></div>`).join('')}<div class="info">مبنای پیشنهاد ۴ نفره مرغ: ۴ فیله + ۲ ران + ۴ کتف‌وبال. سیب‌زمینی و قارچ حدود ۱۰۰ گرم برای هر نفر. برای تنوع: ۲ کوکتل، ۴ توپک، ۳ پیاز و معمولاً ۱ کوردن‌بلو؛ با افزایش نفرات این آیتم‌ها به‌صورت تدریجی زیاد می‌شوند.</div><div class="warn" style="margin-top:10px">V5 هنوز به ترازو یا صندوق/POS وصل نیست؛ وزن واقعی فعلاً دستی وارد می‌شود. V4 دست‌نخورده باقی می‌ماند.</div></div>`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
show('home');
</script></body></html>
