<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ال سوخاری | سفارش‌یار</title>
<style>
:root{--yellow:#ffc928;--dark:#101318;--card:#fff;--muted:#68707d;--green:#16a35a;--red:#e5484d;--bg:#f4f5f7;--blue:#dceeff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#17191d}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:78px}header{background:var(--dark);color:white;padding:18px;position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:900}.brand small{display:block;color:#ffd43b;font-size:12px;margin-top:4px}main{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{padding:22px 14px;border-radius:18px;min-height:120px;text-align:right;font-weight:800;box-shadow:0 3px 12px #0000000d}.tile b{display:block;font-size:17px;margin-bottom:8px}.tile span{font-size:12px;color:#5e6570}.yellow{background:#ffd43b}.blue{background:#dceeff}.green{background:#c9f6dc}.purple{background:#eadcff}
.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #0000000b}h2{font-size:20px;margin:6px 0 15px}h3{font-size:15px;margin:4px 0 10px}label{font-size:12px;color:var(--muted);display:block;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid #d9dde3;border-radius:12px;padding:12px;background:white;outline:none}.row{display:flex;gap:8px;flex-wrap:wrap}.choice{background:#f1f3f5;padding:10px 14px;border-radius:22px}.choice.active{background:var(--yellow);font-weight:800}.primary{width:100%;background:var(--green);color:white;padding:14px;border-radius:13px;font-weight:900;margin-top:12px}.secondary{width:100%;background:#eef0f2;padding:13px;border-radius:13px;font-weight:800;margin-top:8px}.warn{background:#fff3c4;padding:12px;border-radius:12px;font-size:12px;line-height:1.8}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.price{font-weight:900}.muted{color:var(--muted);font-size:12px}.total{font-size:20px;font-weight:900}.greenText{color:var(--green)}.redText{color:var(--red)}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#11151b;color:#b9bec7;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{background:transparent;color:inherit;padding:6px;font-size:11px}.nav button.active{color:var(--yellow);font-weight:900}.badge{padding:4px 8px;border-radius:10px;background:#e8f8ee;color:var(--green);font-size:11px}.screenTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.smallbtn{background:#f0f2f4;border-radius:10px;padding:7px 10px;font-size:12px}.danger{color:var(--red);background:#fff0f0}.success{background:#e8f8ee;color:var(--green)}.countTag{display:inline-block;background:#f0f2f4;padding:4px 7px;border-radius:8px;font-size:11px;margin-top:4px}.productSelect{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.empty{padding:24px;text-align:center;color:var(--muted)}
</style></head><body><div class="app"><header><div class="brand">🍗 ال سوخاری<small>ایجنت فروش و سفارش‌یار</small></div></header><main id="content"></main>
<nav class="nav"><button data-page="home" onclick="show('home')">⌂<br>داشبورد</button><button data-page="orders" onclick="show('orders')">▤<br>سفارش‌ها</button><button data-page="customers" onclick="show('customers')">♙<br>مشتریان</button><button data-page="settings" onclick="show('settings')">⚙<br>تنظیمات</button></nav></div>
<script>
// قیمت‌ها: هزار تومان. نوع محصول مشخص می‌کند وزن‌کشی/تعداد چگونه رفتار کند.
const products={
 'فیله استریپس':{price:1600,type:'weight',piece:'40 تا 150 گرم',icon:'🍗'},
 'ران سوخاری':{price:1100,type:'weight',piece:'40 تا 150 گرم',icon:'🍗'},
 'کتف و بال سوخاری':{price:1100,type:'weight',piece:'40 تا 150 گرم',icon:'🍗'},
 'قارچ سوخاری':{price:890,type:'weight',piece:'بدون محدودیت',icon:'🍄'},
 'سیب‌زمینی سرخ‌کرده':{price:750,type:'weight',piece:'بدون محدودیت',icon:'🍟'},
 'سیب‌زمینی تنوری':{price:790,type:'weight',piece:'بدون محدودیت',icon:'🥔'},
 'چیکن پنیری':{price:1500,type:'count',piece:'هر تکه حدود ۲۰ تا ۲۵ گرم',icon:'🧀'},
 'کوکتل پنیری':{price:1500,type:'weight',piece:'هر تکه حدود ۴۰ تا ۱۵۰ گرم',icon:'🌭'},
 'پیاز سوخاری':{price:850,type:'count',piece:'هر تکه حدود ۲۰ تا ۳۰ گرم',icon:'🧅'},
 'کوردن بلو':{price:200,type:'item',piece:'هر عدد',icon:'🥩'},
 'سس سیر':{price:30,type:'item',piece:'هر عدد',icon:'🥣'},'سس چیلی تای':{price:30,type:'item',piece:'هر عدد',icon:'🌶️'},'سس باربیکیو':{price:30,type:'item',piece:'هر عدد',icon:'🥣'},
 'دیپ پنیر چدار':{price:80,type:'item',piece:'هر عدد',icon:'🧀'},'نوشابه خانواده':{price:122.1,type:'item',piece:'هر عدد',icon:'🥤'},'نوشابه قوطی':{price:95,type:'item',piece:'هر عدد',icon:'🥤'},'نوشابه پت کوچک':{price:55,type:'item',piece:'هر عدد',icon:'🥤'},'لیموناد شیشه':{price:72,type:'item',piece:'هر عدد',icon:'🍋'},'دوغ لیوانی':{price:35,type:'item',piece:'هر عدد',icon:'🥛'},'آب معدنی کوچک':{price:20,type:'item',piece:'هر عدد',icon:'💧'}
};
const groups={weight:['فیله استریپس','ران سوخاری','کتف و بال سوخاری','قارچ سوخاری','سیب‌زمینی سرخ‌کرده','سیب‌زمینی تنوری','کوکتل پنیری'],count:['چیکن پنیری','پیاز سوخاری'],item:['کوردن بلو','سس سیر','سس چیلی تای','سس باربیکیو','دیپ پنیر چدار','نوشابه خانواده','نوشابه قوطی','نوشابه پت کوچک','لیموناد شیشه','دوغ لیوانی','آب معدنی کوچک']};
let state={page:'home',people:2,budget:800,likes:[],note:'',order:[],approx:true,customer:{name:'',phone:'',note:''},orderType:'حضوری'};
function moneyK(k){return Math.round(k*1000).toLocaleString('fa-IR')+' تومان'}
function linePrice(x){const p=products[x.name];if(p.type==='weight')return p.price*x.qty/1000;if(p.type==='item')return p.price*x.qty;return x.finalPrice??0}
function totalK(){return state.order.reduce((s,x)=>s+linePrice(x),0)}
function add(name,qty,mode='planned'){state.order.push({name,qty,mode,finalPrice:null})}
function remove(i){state.order.splice(i,1);show('edit')}
function show(page){state.page=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const c=document.getElementById('content');c.innerHTML=({home,new:newOrder,recommend,recommendation:recommend,edit:editOrder,weigh,confirm:confirmOrder,orders,customers,settings}[page]||home)();window.scrollTo(0,0)}
function home(){let n=JSON.parse(localStorage.getItem('orders')||'[]').length;return `<h2>سلام 👋</h2><div class="grid"><div class="tile yellow" onclick="show('new')"><b>➕ سفارش جدید</b><span>شروع سفارش مشتری</span></div><div class="tile blue" onclick="show('customers')"><b>👥 مشتریان</b><span>جست‌وجو و سفارش‌های قبلی</span></div><div class="tile green" onclick="show('orders')"><b>📋 سفارش‌های امروز</b><span>${n} سفارش ثبت‌شده</span></div><div class="tile purple" onclick="show('settings')"><b>⚙️ تنظیمات</b><span>محصولات و قوانین فروش</span></div></div><div class="card" style="margin-top:14px"><h3>شروع سریع</h3><div class="muted">مثلاً «دو نفریم، حدود ۸۰۰ تومن؛ خودت یه چیز خوشمزه بچین.»</div><button class="primary" onclick="show('new')">ساخت پیشنهاد هوشمند 🤖</button></div>`}
function newOrder(){return `<div class="screenTitle"><h2>سفارش جدید</h2><button class="smallbtn" onclick="show('home')">بازگشت</button></div><div class="card"><h3>👤 اطلاعات مشتری</h3><label>شماره موبایل</label><input id="phone" inputmode="tel" value="${state.customer.phone}" placeholder="مثلاً 0912..." oninput="state.customer.phone=this.value"><label>نام مشتری (اختیاری)</label><input id="customerName" value="${state.customer.name}" placeholder="مثلاً احمد" oninput="state.customer.name=this.value"><label>نوع سفارش</label><div class="row">${['حضوری','بیرون‌بر','ارسال'].map(x=>`<button class="choice ${state.orderType===x?'active':''}" onclick="state.orderType='${x}';show('new')">${x}</button>`).join('')}</div></div><div class="card"><label>تعداد نفرات</label><div class="row">${[1,2,3,4,'۵+'].map(x=>`<button class="choice ${String(state.people)===String(x)?'active':''}" onclick="state.people='${x}';show('new')">${x}</button>`).join('')}</div><label>بودجه (هزار تومان)</label><input id="budget" type="number" value="${state.budget}" oninput="state.budget=+this.value"><label>سلیقه مشتری</label><div class="row">${['فیله','بال و کتف','پنیری','قارچ','سیب‌زمینی'].map(x=>`<button class="choice ${state.likes.includes(x)?'active':''}" onclick="toggleLike('${x}')">${x}</button>`).join('')}</div><label>توضیحات یا محدودیت</label><textarea id="note" rows="3" placeholder="مثلاً مرغ زیاد نمی‌خواد / تند دوست نداره">${state.note}</textarea><button class="primary" onclick="state.note=document.getElementById('note').value;buildRecommendation()">🤖 پیشنهاد بده</button></div>`}
function toggleLike(x){state.likes=state.likes.includes(x)?state.likes.filter(a=>a!==x):[...state.likes,x];show('new')}
function addIfFits(name,qty,budget){let x={name,qty,mode:'planned',finalPrice:null};let k=products[name].type==='weight'?products[name].price*qty/1000:products[name].price*qty; if(k<=budget+0.0001){state.order.push(x);return k}return 0}
function buildRecommendation(){state.order=[];let b=Math.max(0,+state.budget||0);let likes=state.likes;
 // نیاز تقریبی به غذای اصلی بر اساس تجربه فروشگاه؛ سایدها جدا هستند.
 const people=String(state.people);let target=people==='1'?250:people==='2'?500:people==='3'?750:people==='4'?1000:1250;
 let chicken=likes.includes('فیله')?'فیله استریپس':likes.includes('بال و کتف')?'کتف و بال سوخاری':'فیله استریپس';
 if(state.note.includes('مرغ زیاد')||state.note.includes('مرغ کم')) chicken=likes.includes('بال و کتف')?'کتف و بال سوخاری':'قارچ سوخاری';
 if(b>=products[chicken].price*0.25) addIfFits(chicken,Math.min(target,250),b);
 b=state.budget-totalK();
 if((likes.includes('بال و کتف')||likes.length===0)&&b>=275) {addIfFits('کتف و بال سوخاری',250,b);b=state.budget-totalK()}
 if(likes.includes('پنیری')&&b>=200){addIfFits('کوردن بلو',1,b);b=state.budget-totalK()}
 if((likes.includes('قارچ')||likes.length===0)&&b>=222.5){addIfFits('قارچ سوخاری',250,b);b=state.budget-totalK()}
 if((likes.includes('سیب‌زمینی')||likes.length===0)&&b>=187.5){addIfFits('سیب‌زمینی سرخ‌کرده',250,b);b=state.budget-totalK()}
 if(totalK()===0){for(const [n,q] of [['سیب‌زمینی سرخ‌کرده',250],['قارچ سوخاری',250],['کتف و بال سوخاری',250]]){if(addIfFits(n,q,b)){break}}}
 state.approx=true;show('recommend')}
function displayQty(x){const p=products[x.name];if(p.type==='weight')return `${x.qty} گرم`;if(p.type==='count')return `تعداد ${x.qty} <span class="countTag">${p.piece}</span>`;return `تعداد ${x.qty}`}
function recommend(){return `<div class="screenTitle"><h2>🤖 پیشنهاد ال سوخاری</h2><button class="smallbtn" onclick="show('new')">بازگشت</button></div><div class="card"><div class="muted">برای ${state.people} نفر | بودجه: ${moneyK(state.budget)}</div>${state.order.length?state.order.map(x=>`<div class="item"><span>${products[x.name].icon} ${x.name}<div class="muted">${displayQty(x)}</div></span><span class="price">${moneyK(linePrice(x))}</span></div>`).join(''):'<div class="empty">با این بودجه پیشنهاد قابل‌اجرا پیدا نشد؛ مقدار بودجه را افزایش دهید.</div>'}<div style="display:flex;justify-content:space-between;margin-top:14px"><span>جمع تقریبی</span><span class="total">${moneyK(totalK())}</span></div><div class="warn" style="margin-top:10px">⚠️ فیله، ران، بال و کتف و کوکتل اگر دونه‌ای سفارش شوند، قیمت نهایی بعد از وزن‌کشی مشخص می‌شود. وزن هر تکه تقریبی است و قیمت ساختگی اعلام نمی‌کنیم.</div><button class="primary" onclick="show('edit')">✏️ تأیید/تغییر سفارش</button><button class="secondary" onclick="buildRecommendation()">🔄 پیشنهاد جدید</button></div>`}
function editOrder(){return `<div class="screenTitle"><h2>تغییر سفارش</h2><button class="smallbtn" onclick="show('recommend')">بازگشت</button></div><div class="card"><h3>اقلام فعلی</h3>${state.order.length?state.order.map((x,i)=>`<div class="item"><span>${products[x.name].icon} ${x.name}<div class="muted">${displayQty(x)}</div></span><button class="smallbtn danger" onclick="remove(${i})">حذف</button></div>`).join(''):'<div class="empty">هنوز محصولی انتخاب نشده.</div>'}<label>افزودن محصول</label><select id="product">${Object.keys(products).map(n=>`<option value="${n}">${products[n].icon} ${n}</option>`).join('')}</select><label>مقدار</label><input id="qty" type="number" min="1" value="250"><div class="muted" style="margin-top:6px">وزنی: گرم | چیکن پنیری و پیاز: تعداد | سس/نوشیدنی/کوردن: تعداد</div><button class="primary" onclick="addFromEdit()">➕ اضافه کردن</button><button class="primary" onclick="show('weigh')">⚖️ رفتن به وزن‌کشی</button></div>`}
function addFromEdit(){const n=document.getElementById('product').value,q=+document.getElementById('qty').value||0,p=products[n];if(q<=0)return;if(p.type==='item'||p.type==='count')add(n,q);else add(n,q);show('edit')}
function weigh(){return `<div class="screenTitle"><h2>⚖️ وزن‌کشی و مبلغ نهایی</h2></div><div class="card"><div class="warn">برای محصولات وزنی، وزن واقعی را وارد کنید. برای سفارش‌های دانه‌ایِ فیله/ران/بال/کوکتل، تعداد حفظ می‌شود و وزن نهایی هر تکه ثبت می‌شود. اقلام کیلوییِ بدون محدودیت هم هر مقدار قابل ثبت دارند.</div>${state.order.length?state.order.map((x,i)=>{const p=products[x.name];return `<div class="item"><span>${p.icon} ${x.name}<div class="muted">${p.type==='weight'?'وزن فعلی: '+x.qty+' گرم':p.type==='count'?'تعداد: '+x.qty+' | وزن واقعی اختیاری برای کنترل':'تعداد: '+x.qty}</div></span>${p.type==='weight'?`<input style="width:120px;padding:8px" id="w${i}" type="number" min="1" value="${x.qty}" placeholder="گرم">`:p.type==='count'&&['چیکن پنیری','پیاز سوخاری'].includes(x.name)?`<input style="width:120px;padding:8px" id="c${i}" type="number" min="1" value="${x.qty}" placeholder="تعداد">`:`<span class="badge">ثابت</span>`}</div>`}).join(''):'<div class="empty">سفارشی برای وزن‌کشی وجود ندارد.</div>'}<button class="primary" onclick="applyWeights()">محاسبه مبلغ نهایی</button></div>`}
function applyWeights(){state.order.forEach((x,i)=>{const p=products[x.name];if(p.type==='weight'){const w=+document.getElementById('w'+i).value;if(w>0)x.qty=w}if(p.type==='count'&&document.getElementById('c'+i)){const c=+document.getElementById('c'+i).value;if(c>0)x.qty=c}});show('confirm')}
function confirmOrder(){const t=totalK();const over=t>state.budget+0.0001;return `<div class="screenTitle"><h2>تأیید نهایی</h2></div><div class="card"><div class="item"><span>تعداد نفرات</span><b>${state.people}</b></div>${state.order.map(x=>`<div class="item"><span>${products[x.name].icon} ${x.name}<div class="muted">${displayQty(x)}</div></span><b>${moneyK(linePrice(x))}</b></div>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:15px"><span class="total">مبلغ نهایی</span><span class="total">${moneyK(t)}</span></div><div class="${over?'warn redText':'warn greenText'}" style="margin-top:12px">${over?'⚠️ مبلغ از سقف بودجه بیشتر شده؛ قبل از ثبت، سفارش را اصلاح کنید.':'✅ سفارش در محدوده بودجه است.'}</div>${over?'<button class="secondary" onclick="show(\'edit\')">✏️ اصلاح سفارش</button>':'<button class="primary" onclick="saveOrder()">✅ تأیید و ثبت سفارش</button>'}<button class="secondary" onclick="show('edit')">ویرایش</button></div>`}
function getOrders(){return JSON.parse(localStorage.getItem('orders')||'[]')}
function setOrders(a){localStorage.setItem('orders',JSON.stringify(a))}
function getCustomers(){return JSON.parse(localStorage.getItem('customers')||'[]')}
function setCustomers(a){localStorage.setItem('customers',JSON.stringify(a))}
function saveOrder(){if(totalK()>state.budget+0.0001)return;let id=Math.floor(1000+Math.random()*8999);let now=new Date();let saved={id,time:now.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),date:now.toISOString().slice(0,10),total:Math.round(totalK()*1000),items:JSON.parse(JSON.stringify(state.order)),people:state.people,status:'در انتظار',customer:{...state.customer},orderType:state.orderType};let arr=getOrders();arr.unshift(saved);setOrders(arr);if(state.customer.phone){let cs=getCustomers();let c=cs.find(x=>x.phone===state.customer.phone);if(c){c.name=state.customer.name||c.name;c.orders=(c.orders||0)+1;c.lastOrderTotal=saved.total;c.lastOrderAt=saved.time;c.lastItems=saved.items.map(x=>x.name)}else cs.unshift({phone:state.customer.phone,name:state.customer.name||'بدون نام',orders:1,lastOrderTotal:saved.total,lastOrderAt:saved.time,lastItems:saved.items.map(x=>x.name)});setCustomers(cs)}state.order=[];state.note='';state.likes=[];show('orders')}
function setStatus(id,status){let a=getOrders();let o=a.find(x=>x.id===id);if(o){o.status=status;setOrders(a);show('orders')}}
function orders(){let arr=getOrders();return `<div class="screenTitle"><h2>📋 سفارش‌های امروز</h2><span class="badge">${arr.length} سفارش</span></div>${arr.length?arr.map(o=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>#${o.id}</b><span class="badge">${o.status}</span></div><div class="muted">${o.time} | ${o.people} نفر | ${o.orderType||'حضوری'}${o.customer?.phone?' | '+o.customer.phone:''}</div><p>${o.items.map(x=>x.name).join('، ')}</p><b>${moneyK(o.total/1000)}</b><div class="row" style="margin-top:10px">${['در انتظار','در حال آماده‌سازی','آماده','تحویل شد'].map(st=>`<button class="smallbtn ${o.status===st?'success':''}" onclick="setStatus(${o.id},'${st}')">${st}</button>`).join('')}</div></div>`).join(''):'<div class="card empty">هنوز سفارشی ثبت نشده.</div>'}`}
function customers(){let cs=getCustomers();return `<div class="screenTitle"><h2>👥 مشتریان</h2><span class="badge">${cs.length} مشتری</span></div><div class="card"><input id="customerSearch" oninput="renderCustomerList()" placeholder="جست‌وجو با شماره یا نام"><div id="customerList" style="margin-top:10px">${customerListHtml(cs)}</div></div>`}
function customerListHtml(cs){return cs.length?cs.map(c=>`<div class="item"><span>👤 ${c.name}<div class="muted">${c.phone} | ${c.orders||0} سفارش | آخرین: ${c.lastOrderAt||'-'}</div></span><b>${c.lastOrderTotal?moneyK(c.lastOrderTotal/1000):'-'}</b></div>`).join(''):'<div class="empty">هنوز مشتری ثبت نشده. هنگام ثبت سفارش، با شماره موبایل مشتری به‌صورت خودکار ذخیره می‌شود.</div>'}
function renderCustomerList(){let q=(document.getElementById('customerSearch').value||'').trim();let cs=getCustomers().filter(c=>(c.phone||'').includes(q)||(c.name||'').includes(q));document.getElementById('customerList').innerHTML=customerListHtml(cs)}
function settings(){return `<div class="screenTitle"><h2>⚙️ تنظیمات</h2></div><div class="card"><h3>قیمت‌های فعال</h3>${Object.entries(products).map(([n,p])=>`<div class="item"><span>${p.icon} ${n}<div class="muted">${p.type==='weight'?'کیلویی':p.type==='count'?'دانه‌ای با وزن تقریبی هر تکه':'هر عدد'}</div></span><span>${moneyK(p.price)}</span></div>`).join('')}<div class="warn">این نسخه منوی پایه و منطق وزن‌کشی را دارد. اتصال ترازو، صندوق/POS، پنل قیمت‌گذاری، مشتریان و هوش مصنوعی واقعی در مرحله بعد اضافه می‌شود.</div></div>`}
show('home');
</script></body></html>
