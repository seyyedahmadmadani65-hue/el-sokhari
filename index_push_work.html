let newOrderAlertCount=0;
let audioCtx=null;
async function unlockAlertAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') await audioCtx.resume();
    return audioCtx.state==='running';
  }catch(e){console.warn(e);return false}
}
async function testAlertSound(){

function playOrderBeep(){
  try{
    unlockAlertAudio();
    if(!audioCtx)return;
    const now=audioCtx.currentTime;
    [0,0.16,0.32].forEach((d,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=i===1?880:660;
      g.gain.setValueAtTime(0.0001,now+d);g.gain.exponentialRampToValueAtTime(0.16,now+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+d+0.13);
      o.connect(g);g.connect(audioCtx.destination);o.start(now+d);o.stop(now+d+0.14);
    });
  }catch(e){console.warn(e)}
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function enablePushNotifications(){
  try{
    if(CUSTOMER_MODE){ alert('اعلان Push فقط برای پنل مدیریت فعال می‌شود.'); return; }
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      alert('مرورگر این گوشی از اعلان Push پشتیبانی نمی‌کند. Chrome را به‌روز کن.');
      return;
    }
    const {data:{user},error:userError}=await sb.auth.getUser();
    if(userError||!user){ alert('ابتدا وارد پنل مدیریت شوید.'); return; }

    if(!('Notification' in window)){
      alert('اعلان‌های مرورگر روی این گوشی در دسترس نیست.');
      return;
    }
    let permission=Notification.permission;
    if(permission!=='granted') permission=await Notification.requestPermission();
    if(permission!=='granted'){
      alert('اجازه اعلان داده نشد. از تنظیمات Chrome، اعلان‌های این سایت را فعال کن.');
      return;
    }

    const registration=await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    let subscription=await registration.pushManager.getSubscription();
    if(!subscription){
      subscription=await registration.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    const json=subscription.toJSON();
    const p256dh=json?.keys?.p256dh;
    const auth=json?.keys?.auth;
    if(!subscription.endpoint||!p256dh||!auth) throw new Error('Push subscription data is incomplete');

    const {error}=await sb.from('push_subscriptions').upsert({
      user_id:user.id,
      endpoint:subscription.endpoint,
      p256dh,
      auth
    },{onConflict:'endpoint'});
    if(error) throw error;

    alert('✅ اعلان حتی با بسته بودن پنل فعال شد.\nاز این به بعد سفارش جدید می‌تواند روی همین گوشی اعلان شود.');
  }catch(e){
    console.error('Push subscription error:',e);
    alert('فعال‌سازی اعلان Push انجام نشد. اتصال اینترنت و اجازه اعلان Chrome را بررسی کن.');
  }
}
async function initRealtime(){
  if(CUSTOMER_MODE||ordersChannel)return;
  unlockAlertAudio();

  // Orders already on screen are not "new".
  knownOrderIds=new Set(remoteOrders.map(o=>String(o.dbId||o.id||'')));

  const handleNewOrder=(order)=>{
    const id=String(order?.id||order?.order_number||'');
    if(!id || knownOrderIds.has(id)) return;
    knownOrderIds.add(id);
    showOrderAlert(order||{});
  };

  ordersChannel=sb.channel('orders-live-v553')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},async(payload)=>{
      try{
        handleNewOrder(payload?.new||{});
        try{
          await fetchRemoteOrders();
          if(state.page==='orders'||state.page==='ordersAll'||state.page==='home'||state.page==='reports')show(state.page);
        }catch(e){console.warn('Realtime refresh failed:',e)}
      }catch(e){console.warn('Realtime notification error:',e)}
    })
    .subscribe((status,error)=>{
      console.log('Orders realtime status:',status,error||'');
      const el=document.getElementById('realtimeStatus');
      if(!el)return;
      if(status==='SUBSCRIBED'){
        el.textContent='🟢 اعلان لحظه‌ای فعال است';
        el.className='mini greenText';
      }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
        el.textContent='🟠 اتصال لحظه‌ای مشکل دارد — پشتیبان فعال است';
        el.className='mini';
      }
    });

  // Fallback: check for new orders every 5 seconds.
  // This keeps the panel live even when browser/mobile Realtime is unreliable.
  if(!realtimePollTimer){
    realtimePollTimer=setInterval(async()=>{
      try{
        const before=new Set(remoteOrders.map(o=>String(o.dbId||o.id||'')));
        const fresh=await fetchRemoteOrders();
        for(const o of fresh){
          const id=String(o.dbId||o.id||'');
          if(id && !before.has(id)) handleNewOrder(o);
        }
        if(state.page==='orders'||state.page==='ordersAll'||state.page==='home'||state.page==='reports')show(state.page);
      }catch(e){console.warn('Live polling failed:',e)}
    },5000);
  }
}

function baseForPeople(n){const f=Math.max(1,Math.round(4*n/4));const r=Math.max(0,Math.round(2*n/4));const w=Math.max(1,Math.round(4*n/4));return {fillet:f,ran:r,wings:w}}
function noteText(){return String(state.note||'').replace(/[‌]/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').trim();}
function tastePref(name){const t=normalizeIntentText(noteText()); if(state.likes.includes(name)) return true; if(name==='تند') return /تند|اسپایسی|فلفلی/.test(t); if(name==='سیرکننده') return /سیرکننده|سیر بشه|سیر بشیم|گرسنه/.test(t); if(name==='اقتصادی') return /اقتصادی|مقرون به صرفه|به صرفه|کم هزینه|ارزان/.test(t); return false;}
function normalizeIntentText(t){return String(t||'').replace(/[‌]/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').trim();}
function noteIntent(){
  const t=normalizeIntentText(noteText());
  const map={
    chicken:['مرغ','فیله','ران','بال','کتف','کوکتل','چیکن پنیری','توپک','کوردن'],
    potato:['سیب زمینی','سیب‌زمینی','سیبزمینی','سیب زمینی سرخ','سیب زمینی تنوری'],
    mushroom:['قارچ'], onion:['پیاز'], cordon:['کوردن','کوردن بلو'], cocktail:['کوکتل'],
    cheesy:['چیکن پنیری','توپک','پنیری'], pizza:['پیتزا']
  };
  const mentioned=[]; for(const [key,words] of Object.entries(map)) if(words.some(w=>t.includes(w))) mentioned.push(key);
  const only=/(?:^|\s)(?:فقط|صرفاً|تنها)(?:\s|$)/.test(t) || /فقط همین/.test(t);
  const explicitJoin=/(?:\s|^)(?:و|،|,)(?:\s|$)/.test(t);
  const bounded=/(?:باشه|باشد|بذار|بذارید|می ?خوام|می ?خواه[مید]|می ?خوایم|دوست دارم|در حد|هم باشه|هم می ?خوام)/.test(t);
  const exclude=/(?:نباشه|نباشد|نمی ?خوام|نمی ?خواهم|نمی ?خواه[مید]|بدون|حذف|نذار|نذارید|نمی ?خواد)/.test(t);

function hasNoToken(t, words){return words.some(w=>new RegExp('(?:بدون\\s+(?:هیچ\\s+)?'+w+'|'+w+'\\s*(?:نباشه|نباشد|نمی ?خوام|نمی ?خواهم|نمی ?خواه[مید]|حذف بشه|حذف شود))').test(t));}
function excludedItems(){
  const t=normalizeIntentText(noteText());
  const deny=new Set();
  if(hasNoToken(t,['مرغ'])) ['فیله استریپس','ران سوخاری','کتف و بال سوخاری','کوکتل پنیری','چیکن پنیری'].forEach(x=>deny.add(x));
  if(hasNoToken(t,['فیله'])) deny.add('فیله استریپس');
  if(hasNoToken(t,['ران'])) deny.add('ران سوخاری');
  if(hasNoToken(t,['بال','کتف'])) deny.add('کتف و بال سوخاری');
  if(hasNoToken(t,['کوکتل'])) deny.add('کوکتل پنیری');
  if(hasNoToken(t,['توپک','چیکن پنیری','پنیری'])) {deny.add('چیکن پنیری'); deny.add('کوردن بلو');}
  if(hasNoToken(t,['قارچ'])) deny.add('قارچ سوخاری');
  if(hasNoToken(t,['سیب زمینی','سیب‌زمینی','سیبزمینی'])) {deny.add('سیب‌زمینی سرخ‌کرده');deny.add('سیب‌زمینی تنوری');}
  if(hasNoToken(t,['پیاز'])) deny.add('پیاز سوخاری');
  if(hasNoToken(t,['کوردن'])) deny.add('کوردن بلو');
  if(hasNoToken(t,['پیتزا'])) ['پیتزا مخلوط ۲ نفره','پیتزا قارچ و مرغ ۲ نفره','پیتزا پپرونی ۲ نفره'].forEach(x=>deny.add(x));
  return deny;
}
function requiredItems(){
  const t=normalizeIntentText(noteText()); const req=new Set();
  if(/(?:حتماً|حتما|لازم(?:ه| است)|باید|حتماً باشه|حتما باشه)/.test(t)){
    if(t.includes('کوردن')) req.add('کوردن بلو');
    if(t.includes('کوکتل')) req.add('کوکتل پنیری');
    if(t.includes('توپک')||t.includes('چیکن پنیری')) req.add('چیکن پنیری');
    if(t.includes('پنیری') && !t.includes('نباشه') && !t.includes('نباشد') && !t.includes('نمی خوا')) req.add('کوردن بلو');
    if(t.includes('پیاز')) req.add('پیاز سوخاری');
    if(t.includes('قارچ')) req.add('قارچ سوخاری');
    if(t.includes('سیب زمینی')||t.includes('سیب‌زمینی')||t.includes('سیبزمینی')) req.add('سیب‌زمینی سرخ‌کرده');
  }
  return req;
}
function pizzaIntent(){
  const t=normalizeIntentText(noteText());
  return {mentioned:t.includes('پیتزا'),pepperoni:t.includes('پپرونی'),mixed:t.includes('مخلوط'),chickenMushroom:t.includes('قارچ و مرغ')};
}
function noChickenRequested(){return excludedItems().has('فیله استریپس')&&excludedItems().has('ران سوخاری')&&excludedItems().has('کتف و بال سوخاری')&&excludedItems().has('کوکتل پنیری')&&excludedItems().has('چیکن پنیری');}
function allowedItemIntent(){
  const it=noteIntent(); if(!it.explicit) return null;
  const t=it.t, allow=new Set();
  // A "only" request is restrictive. For normal "X and Y" requests, it is also restrictive.
  if(it.mentioned.includes('chicken')){
    if(t.includes('فیله')) allow.add('فیله استریپس');
    if(t.includes('ران')) allow.add('ران سوخاری');
    if(t.includes('کتف')||t.includes('بال')) allow.add('کتف و بال سوخاری');
    if(t.includes('کوکتل')) allow.add('کوکتل پنیری');
    if(t.includes('چیکن پنیری')||t.includes('توپک')) allow.add('چیکن پنیری');
    if(t.includes('کوردن')) allow.add('کوردن بلو');
    if(t.includes('مرغ')&&!['فیله استریپس','ران سوخاری','کتف و بال سوخاری','کوکتل پنیری','چیکن پنیری','کوردن بلو'].some(x=>allow.has(x))) ['فیله استریپس','ران سوخاری','کتف و بال سوخاری'].forEach(x=>allow.add(x));
  }
  if(it.mentioned.includes('potato')) {allow.add('سیب‌زمینی سرخ‌کرده');}
  if(it.mentioned.includes('mushroom')) allow.add('قارچ سوخاری');
  if(it.mentioned.includes('onion')) allow.add('پیاز سوخاری');
  if(it.mentioned.includes('cordon')) allow.add('کوردن بلو');
  if(it.mentioned.includes('cocktail')) allow.add('کوکتل پنیری');
  if(it.mentioned.includes('cheesy')) {allow.add('چیکن پنیری');allow.add('کوکتل پنیری');allow.add('کوردن بلو');}
  const deny=excludedItems(); deny.forEach(x=>allow.delete(x));
  const positive=allow.size>0;
  return positive ? allow : null;
}
function adjustChickenForTaste(base){
  let x={...base}; const deny=excludedItems();
  if(noChickenRequested()) return {fillet:0,ran:0,wings:0};
  const allowed=allowedItemIntent();
  if(allowed){
    x.fillet=allowed.has('فیله استریپس')?x.fillet:0;
    x.ran=allowed.has('ران سوخاری')?x.ran:0;
    x.wings=allowed.has('کتف و بال سوخاری')?x.wings:0;
  }
  if(deny.has('فیله استریپس')) x.fillet=0;
  if(deny.has('ران سوخاری')) x.ran=0;
  if(deny.has('کتف و بال سوخاری')) x.wings=0;
  if(state.likes.includes('فیله بیشتر') && x.fillet>0){x.fillet+=Math.max(1,Math.round(x.ran/2));x.ran=Math.max(0,x.ran-1);x.wings=Math.max(0,x.wings-1)}
  if(state.likes.includes('استخوان‌دار بیشتر') && (x.ran>0||x.wings>0)){x.ran+=1;x.wings+=Math.max(1,Math.round(x.fillet/4));if(x.fillet>0)x.fillet=Math.max(1,x.fillet-1)}
  if(state.likes.includes('مرغ کمتر')||/مرغ\s*(کم|زیاد ن?می)/.test(noteText())){if(x.fillet>0)x.fillet=Math.max(1,Math.round(x.fillet*.75));if(x.ran>0)x.ran=Math.max(0,Math.round(x.ran*.75));if(x.wings>0)x.wings=Math.max(1,Math.round(x.wings*.75))}
  if(tastePref('سیرکننده')){if(x.fillet>0)x.fillet+=1;else if(x.ran>0)x.ran+=1;else if(x.wings>0)x.wings+=1;}
  if(tastePref('اقتصادی')){
    // اقتصادی: مقدار مرغ کمی جمع‌وجورتر، بدون حذف غذای اصلی برای یک وعده منطقی.
    if(x.fillet>1)x.fillet=Math.max(1,x.fillet-1);
    if(x.wings>1)x.wings=Math.max(1,x.wings-1);
    if(x.ran>2)x.ran=Math.max(1,x.ran-1);
  }
  return x;
}

function chickenConfirm(){const p=state.chickenPlan;const none=noChickenRequested();const allowed=allowedItemIntent();return `<div class="screenTitle">${backButton()}<h2>🍗 مرحله ۱: مقدار مرغ</h2></div><div class="stepbar"><span class="on"></span><span></span><span></span><span></span></div><div class="card">${none?`<div class="successbox">طبق توضیحات مشتری، <b>مرغ نباید در سفارش باشد</b>؛ بنابراین اقلام مرغی حذف شدند.</div>`:`<div class="bigask">${allowed?`طبق توضیحات مشتری، فقط اقلام مشخص‌شده در توضیحات پیشنهاد می‌شوند:`:`برای ${state.people} نفر، این ترکیب رو پیشنهاد می‌کنم:`}</div>${p.fillet?`<div class="item"><span>🍗 فیله استریپس</span><b>${p.fillet} عدد</b></div>`:''}${p.ran?`<div class="item"><span>🍗 ران سوخاری</span><b>${p.ran} عدد</b></div>`:''}${p.wings?`<div class="item"><span>🍗 کتف و بال سوخاری</span><b>${p.wings} عدد</b></div>`:''}${(!p.fillet&&!p.ran&&!p.wings)?`<div class="empty">هیچ آیتم مرغی برای پیشنهاد باقی نمانده.</div>`:''}<div class="info" style="margin-top:12px">قیمت دقیق اقلام دانه‌ای بعد از وزن‌کشی مشخص می‌شود.</div><p class="bigask" style="margin-top:16px">این مقدار مرغ براتون کافیه یا بیشتر میل دارید؟</p>`}<button class="primary" onclick="acceptChicken()">${none?'بله، بریم مرحله بعد':allowed?'بله، بریم مرحله بعد':'کافیه، بریم مرحله بعد'}</button>${none||allowed?'':`<button class="secondary" onclick="moreChicken()">بیشتر می‌خوایم 🍗</button><button class="secondary" onclick="chickenLess()">کمی کمتر</button>`}</div>`}
function acceptChicken(){

function varietyBase(n){

function addCount(name, qty){
  qty = Number(qty || 0);
  if (qty <= 0) return;
  const product = products[name];
  if (!product) return;

  const existing = state.order.find(x => x.name === name);
  if (existing) {
    existing.qty = Number(existing.qty || 0) + qty;
    if (existing.count != null) existing.count = Number(existing.count || 0) + qty;
  } else {
    state.order.push({
      name: name,
      qty: qty,
      mode: product.type === 'item' ? 'item' : 'count',
      count: product.type === 'item' ? null : qty,
      finalWeight: null
    });
  }
}

function estimatedLinePrice(x){
  const p=products[x.name];
  // Budget values are stored in تومان, so this function must also return تومان.
  if(p.type==='item') return p.price*1000;
  if(x.finalWeight&&Number(x.finalWeight)>0) return p.price*Number(x.finalWeight);
  if(p.type==='weightCount'){
    const avg={
      'فیله استریپس':95,
      'ران سوخاری':95,
      'کتف و بال سوخاری':95,
      'کوکتل پنیری':95,
      'چیکن پنیری':22.5,
      'پیاز سوخاری':25
    }[x.name]||50;
    return p.price*avg*Number(x.count||x.qty||0);
  }
  return p.price*Number(x.qty||0);
}

  state.budgetWarning=state.budgetMode==='around'
    ?`⚠️ این ترکیب با وزن‌های معمول احتمالاً حدود ${budgetMoney(estimate)} می‌شود؛ یعنی حدود ${budgetMoney(over)} بیشتر از بودجه حدودی ${budgetMoney(budget)}.`

function suggestAdjustment(){
  if(state.budget==null)return false;
  const budget=+state.budget, current=totalK();
  if(current<=budget+0.0001)return true;

  // V5.14: قبل از اعلام «غیرممکن»، همه اقلام قابل تنظیم را بررسی می‌کنیم.
  // اقلام دانه‌ای با کاهش تعداد و وزن متناسب با وزن فعلی بررسی می‌شوند؛
  // اقلام وزنی می‌توانند تا ۵۰ گرم یا صفر (حذف کامل) تنظیم شوند.
  const adjustable=state.order.filter(x=>products[x.name].type!=='item');
  const countItems=adjustable.filter(x=>products[x.name].type==='weightCount'&&x.count&&Number(x.finalWeight||0)>0);
  const weightItems=adjustable.filter(x=>products[x.name].type!=='item'&&products[x.name].type!=='weightCount');

  const ranges=[];
  for(const x of countItems){
    const c=Number(x.count), w=Number(x.finalWeight||0), arr=[];
    for(let n=c;n>=1;n--){
      const ww=Math.round(w*n/c);
      arr.push({count:n,weight:ww});
    }
    ranges.push({x,arr});
  }
  for(const x of weightItems){
    const cur=Number(x.finalWeight||x.qty||0), arr=[];
    for(let ww=cur;ww>=50;ww-=25)arr.push({weight:ww});
    if(cur>=50)arr.push({weight:0});
    ranges.push({x,arr});
  }

  // Nothing except fixed-price items can be adjusted.
  if(!ranges.length)return false;

  let best=null, checked=0;
  function walk(i,plan,total,score){
    if(checked++>250000)return;
    if(i===ranges.length){
      if(total>budget+0.0001)return;
      const gap=budget-total;
      // اول کمترین تعداد تغییر؛ سپس کمترین دوری از سقف؛ سپس توزیع متعادل کاهش.
      const reductions=plan.reduce((s,a)=>s+(a.reduction||0),0);
      const imbalance=plan.reduce((s,a)=>s+(a.fraction||0)*(a.fraction||0),0);
      const key=[reductions,gap,imbalance];
      if(!best||key[0]<best.key[0]||(key[0]===best.key[0]&&(key[1]<best.key[1]-0.0001||(Math.abs(key[1]-best.key[1])<0.0001&&key[2]<best.key[2]))))best={plan,total,key};
      return;
    }
    const {x,arr}=ranges[i],p=products[x.name],baseW=Number(x.finalWeight||x.qty||0),baseC=Number(x.count||0);
    for(const opt of arr){
      let line;
      if(p.type==='weightCount')line=p.price*opt.weight/1000;
      else line=p.price*opt.weight/1000;
      const oldLine=linePrice(x), reduction=Math.max(0,oldLine-line);
      if(total+line>budget+current)continue;
      const fraction=baseW>0?Math.max(0,(baseW-opt.weight)/baseW):0;
      walk(i+1,plan.concat([{x,opt,reduction:(opt.count?baseC-opt.count:0),fraction}]),total+line,score+reduction);
    }
  }

  // Fixed-price items stay untouched; start from their current total.
  const fixedTotal=state.order.filter(x=>products[x.name].type==='item').reduce((s,x)=>s+linePrice(x),0);
  walk(0,[],fixedTotal,0);
  if(!best)return false;

  let changed=false, countChanged=false;
  for(const a of best.plan){
    const x=a.x,p=products[x.name],o=a.opt;
    if(p.type==='weightCount'){
      if(Number(x.count)!==Number(o.count)||Number(x.finalWeight)!==Number(o.weight)){
        x.count=o.count;x.qty=o.count;x.finalWeight=o.weight;changed=true;countChanged=true;
      }
    }else if(Number(x.finalWeight||x.qty)!==Number(o.weight)){
      x.finalWeight=o.weight;changed=true;
    }
  }
  state.needsReweigh=changed;
  state.budgetAdjustmentNote=countChanged?'برای رسیدن به سقف بودجه، تعداد بعضی اقلام دانه‌ای هم تنظیم شده؛ لطفاً وزن‌کشی را دوباره انجام دهید.':'مقدار بعضی اقلام برای رسیدن به سقف بودجه تنظیم شده؛ لطفاً وزن‌کشی را دوباره انجام دهید.';
  return changed;
}
function applyBudgetAdjustment(){

}

function ordersAll(){const arr=getOrders();return `<div class="screenTitle">${backButton()}<h2>📚 همه سفارش‌ها</h2><button class="smallbtn" onclick="show('orders')">امروز</button></div>${arr.length?arr.map(o=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>#${o.id}</b><span class="badge">${o.status}</span></div><div class="muted">${o.date||'-'} | ${o.time||'-'} | ${o.customer?.name?esc(o.customer.name):'بدون نام'}</div><div class="mini">${o.items.map(x=>x.name).join('، ')}</div><b>${moneyK((o.total||0)/1000)}</b><button class="secondary" onclick="state.detailId=${o.id};show('orderDetail')">👁 مشاهده جزئیات</button></div>`).join(''):'<div class="card empty">هنوز سفارشی ثبت نشده.</div>'}`}
function customers(){let cs=getCustomers();return `<div class="screenTitle">${backButton()}<h2>👥 مشتریان</h2><span class="badge">${cs.length} مشتری</span></div><div class="card"><input id="customerSearch" oninput="renderCustomerList()" placeholder="جست‌وجو با شماره یا نام"><div id="customerList" style="margin-top:10px">${customerListHtml(cs)}</div></div>`}
function customerListHtml(cs){return cs.length?cs.map(c=>`<div class="card" style="margin:8px 0;cursor:pointer" onclick="state.customerDetailPhone='${esc(c.phone)}';show('customerDetail')"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span><b>👤 ${esc(c.name)}</b><div class="mini">${esc(c.phone)} | ${c.orders||0} سفارش | آخرین: ${c.lastOrderAt||'-'}</div></span><b>${c.lastOrderTotal?moneyK(c.lastOrderTotal/1000):'-'}</b></div><div class="mini" style="margin-top:6px">مجموع خرید: ${c.totalSpent?moneyK(c.totalSpent/1000):'-'} • مشاهده سابقه ›</div></div>`).join(''):'<div class="empty">هنوز مشتری ثبت نشده.</div>'}
function renderCustomerList(){const el=document.getElementById('customerSearch');if(!el)return;let q=(el.value||'').trim();let cs=getCustomers().filter(c=>(c.phone||'').includes(q)||(c.name||'').includes(q));document.getElementById('customerList').innerHTML=customerListHtml(cs)}
function customerDetail(phone=state.customerDetailPhone){const c=getCustomers().find(x=>x.phone===phone);if(!c)return `<div class="card empty">مشتری پیدا نشد.</div>`;const history=(c.history||[]).slice().reverse();return `<div class="screenTitle">${backButton()}<h2>👤 ${esc(c.name||'بدون نام')}</h2></div><div class="card"><div class="item"><span>شماره موبایل</span><b>${esc(c.phone)}</b></div><div class="item"><span>تعداد سفارش</span><b>${c.orders||0}</b></div><div class="item"><span>مجموع خرید</span><b>${c.totalSpent?moneyK(c.totalSpent/1000):'-'}</b></div></div><div class="card"><h3>📚 سابقه سفارش‌ها</h3>${history.length?history.map(h=>`<div class="item"><span><b>#${h.id}</b><div class="mini">${esc(h.date||'-')} | ${esc(h.time||'-')} | ${esc(h.status||'در انتظار')}<br>${(h.items||[]).map(x=>esc(x.name)).join('، ')}</div></span><b>${moneyK((h.total||0)/1000)}</b></div>`).join(''):'<div class="empty">سابقه‌ای ثبت نشده.</div>'}</div><button class="primary" onclick="startNew();state.customer.phone='${esc(c.phone)}';state.customer.name='${esc(c.name||'')}';show('new')">➕ سفارش جدید برای این مشتری</button>`}
function reportDateOffset(days){const d=new Date();d.setDate(d.getDate()+days);return todayKey(d)}
function reportRange(mode){const end=todayKey();if(mode==='day')return {label:'امروز',start:end,end};if(mode==='week')return {label:'۷ روز اخیر',start:reportDateOffset(-6),end};const d=new Date();const start=new Date(d.getFullYear(),d.getMonth(),1);return {label:'این ماه',start:todayKey(start),end};}
function reports(){const mode=state.reportMode||'day',r=reportRange(mode),all=getOrders(),active=all.filter(o=>o.status!=='لغو شد'&&o.date>=r.start&&o.date<=r.end),sales=active.reduce((s,o)=>s+(o.total||0),0),avg=active.length?sales/active.length:0;
let phones=[...new Set(active.map(o=>o.customer?.phone).filter(Boolean))],newC=0,oldC=0;phones.forEach(phone=>{const first=all.filter(o=>o.status!=='لغو شد'&&o.customer?.phone===phone).sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];if(first&&first.date>=r.start&&first.date<=r.end)newC++;else oldC++;});
const itemMap={};active.forEach(o=>(o.items||[]).forEach(x=>{const revenue=linePrice(x);if(!itemMap[x.name])itemMap[x.name]={name:x.name,revenue:0,count:0};itemMap[x.name].revenue+=revenue;itemMap[x.name].count+=(products[x.name]?.type==='item'?(x.qty||0):(x.count||1));}));
const top=Object.values(itemMap).sort((a,b)=>b.revenue-a.revenue).slice(0,5),maxTop=top[0]?.revenue||1;
let days=[];if(mode==='day'){days=[{key:r.end,label:'امروز'}]}else{let cur=new Date(r.start+'T00:00:00');const end=new Date(r.end+'T00:00:00');while(cur<=end){days.push({key:todayKey(cur),label:cur.toLocaleDateString('fa-IR',{day:'numeric',month:'short'})});cur.setDate(cur.getDate()+1);}}
const daily=days.map(d=>{const os=active.filter(o=>o.date===d.key),v=os.reduce((s,o)=>s+(o.total||0),0);return {...d,count:os.length,value:v};});const maxDay=Math.max(...daily.map(x=>x.value),1);
return `<div class="screenTitle">${backButton()}<h2>📊 گزارش‌ها</h2></div><div class="row" style="margin-bottom:12px"><button class="choice ${mode==='day'?'active':''}" onclick="state.reportMode='day';show('reports')">امروز</button><button class="choice ${mode==='week'?'active':''}" onclick="state.reportMode='week';show('reports')">۷ روز اخیر</button><button class="choice ${mode==='month'?'active':''}" onclick="state.reportMode='month';show('reports')">این ماه</button></div><div class="card"><h3>💰 خلاصه ${r.label}</h3><div class="item"><span>فروش ثبت‌شده</span><b>${moneyK(sales/1000)}</b></div><div class="item"><span>تعداد سفارش</span><b>${active.length}</b></div><div class="item"><span>میانگین مبلغ هر سفارش</span><b>${active.length?moneyK(avg/1000):'-'}</b></div></div><div class="card"><h3>👥 مشتریان</h3><div class="item"><span>مشتری جدید</span><b>${newC}</b></div><div class="item"><span>مشتری قدیمی</span><b>${oldC}</b></div><div class="mini">مبنای این بخش شماره موبایل ثبت‌شده برای سفارش‌هاست.</div></div><div class="card"><h3>🏆 پرفروش‌ترین آیتم‌ها</h3>${top.length?top.map((x,i)=>`<div class="item"><span>${i+1}. ${products[x.name]?.icon||'🍗'} ${esc(x.name)}<div class="mini">${x.count} عدد/ثبت • ${moneyK(x.revenue/1000)}</div><div style="height:7px;background:#edf0f2;border-radius:8px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${Math.max(8,Math.round(x.revenue/maxTop*100))}%;background:#ffc928;border-radius:8px"></div></div></span><b>${moneyK(x.revenue/1000)}</b></div>`).join(''):'<div class="empty">در این بازه سفارشی ثبت نشده.</div>'}</div><div class="card"><h3>📈 فروش روزانه</h3>${daily.map(d=>`<div class="item"><span>${d.label}<div class="mini">${d.count} سفارش</div><div style="height:7px;background:#edf0f2;border-radius:8px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${d.value?Math.max(5,Math.round(d.value/maxDay*100)):0}%;background:#16a35a;border-radius:8px"></div></div></span><b>${d.value?moneyK(d.value/1000):'-'}</b></div>`).join('')}</div><div class="card"><div class="mini">سفارش‌های لغوشده در فروش این گزارش محاسبه نشده‌اند.</div></div>`}
function settings(){return `<div class="screenTitle">${backButton()}<h2>⚙️ تنظیمات</h2></div><div class="card"><h3>قیمت‌های فعال</h3>${Object.entries(products).map(([n,p])=>`<div class="item"><span>${p.icon} ${n}<div class="mini">${p.type==='weight'?'کیلویی':p.type==='weightCount'?'کیلویی؛ امکان سفارش دانه‌ای و وزن‌کشی نهایی':'هر عدد'}</div></span><span>${p.type==='item'?moneyK(p.price):moneyK(p.price)+' / کیلو'}</span></div>`).join('')}<div class="info">مبنای پیشنهاد ۴ نفره مرغ: ۴ فیله + ۲ ران + ۴ کتف‌وبال. سیب‌زمینی و قارچ فقط بر اساس وزن (گرم) انتخاب می‌شوند؛ حدود ۱۰۰ گرم برای هر نفر. برای تنوع: ۲ کوکتل، ۴ توپک، ۳ پیاز و معمولاً ۱ کوردن‌بلو؛ با افزایش نفرات این آیتم‌ها به‌صورت تدریجی زیاد می‌شوند.</div><div class="warn" style="margin-top:10px">V5.49 هنوز به ترازو یا صندوق/POS وصل نیست؛ وزن واقعی فعلاً دستی وارد می‌شود. V4 دست‌نخورده باقی می‌ماند.</div></div>`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(CUSTOMER_MODE) document.body.classList.add('customer-mode');
initApp();
</script></body></html>
